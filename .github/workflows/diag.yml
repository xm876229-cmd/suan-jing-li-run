name: CI Diagnostic

# 临时诊断：确认这个仓库的 Actions 能不能跑起来。
# Linux 任务如果也秒取消，说明是账号/计费层面的限制；
# Linux 能跑、macOS 被取消，说明是 macOS 跑额的额度问题。

on:
  workflow_dispatch:

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 打个招呼
        run: |
          echo "actions ok"
          python3 --version
          uname -a
