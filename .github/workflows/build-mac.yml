name: Build macOS (Apple Silicon)

# 为什么放在 GitHub 上编译：
#   PyInstaller 不能交叉编译，Windows 上产不出能跑的 .app。
#   这里用 GitHub 提供的 macOS 机器（macos-14 = arm64）编好，
#   再把 .app 打包成 zip 作为构建产物下载，开发者不需要有 Mac。
#
# 触发方式：
#   1. 手动：仓库 Actions → Build macOS → Run workflow
#   2. 打标签：git push origin v0.24.83 → 自动编，并挂到 Release 上

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要挂到哪个 Release（如 v0.24.83；留空只出 Artifact）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write      # 打标签触发时要往 Release 里传附件

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller pillow

      - name: 取回成本主表（Windows 免安装包里自带，本来就是公开的）
        run: |
          python3 - <<'PY'
          import io, json, pathlib, urllib.request, zipfile

          api = ("https://api.github.com/repos/" + "${{ github.repository }}" +
                 "/releases?per_page=10")
          rel = json.load(urllib.request.urlopen(api, timeout=30))
          url = next((a["browser_download_url"] for r in rel
                      for a in r.get("assets", [])
                      if a["name"].startswith("JingLiHelper-Portable")), "")
          print("来源：", url or "（没找到）")
          if not url:
              raise SystemExit(0)
          data = urllib.request.urlopen(url, timeout=180).read()
          z = zipfile.ZipFile(io.BytesIO(data))
          # 用后缀匹配而不是 shell 通配：中文路径在 unzip 里会被当成 CP437，匹配不上
          name = next((n for n in z.namelist() if n.replace("\\", "/").endswith("数据/成本/master.csv")), "")
          if not name:
              print("压缩包里没有成本表")
              raise SystemExit(0)
          dst = pathlib.Path("数据/成本/master.csv")
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_bytes(z.read(name))
          print("成本表行数：", len(dst.read_text(encoding="utf-8", errors="replace").splitlines()))
          PY

      - name: 打包 .app
        run: bash packaging/build_mac.sh

      - name: 自检产物（架构 / 结构 / 资源）
        run: |
          APP="dist/净利助手.app"
          echo "== 体积 =="
          du -sh "$APP"
          echo "== Contents =="
          ls "$APP/Contents"
          echo "== 可执行文件架构 =="
          file "$APP/Contents/MacOS/JingLiHelper"
          lipo -archs "$APP/Contents/MacOS/JingLiHelper"
          echo "== 资源（扩展 / 默认配置 / 默认成本）=="
          ls "$APP/Contents/Frameworks" | head -20
          test -d "$APP/Contents/Frameworks/浏览器扩展" && echo "浏览器扩展 ✓"
          test -d "$APP/Contents/Frameworks/默认配置" && echo "默认配置 ✓"
          test -f "$APP/Contents/Frameworks/默认数据/costs/master.csv" && echo "默认成本表 ✓"
          echo "== Info.plist =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          echo "== 源码模式冒烟：导入全部模块 =="
          python3 -c "import sys;sys.path.insert(0,'.');import src.paths,src.calc,src.report,src.loader,src.setup_core,src.platform_os;print('import ok')"

      - name: 真跑一遍（诊断 / 起桥 / 接口 / 配置落盘）
        run: |
          set -uo pipefail
          APP="dist/净利助手.app/Contents/MacOS/JingLiHelper"
          echo "===== 1) 诊断（会顺带建数据目录、补默认配置）====="
          "$APP" doctor
          echo
          echo "===== 2) 数据目录落在哪 ====="
          D="$HOME/Library/Application Support/JingLiHelper"
          ls -la "$D" || true
          CONF=$(ls "$D/配置" 2>/dev/null | wc -l | tr -d ' ')
          COST=$(wc -l < "$D/数据/成本/master.csv" 2>/dev/null || echo 0)
          echo "配置个数：$CONF"
          echo "成本表行数：$COST"
          if [ "${CONF:-0}" -lt 8 ]; then
            echo "::error::默认配置没播种（只有 $CONF 个），首次运行会没有费率"
            exit 1
          fi
          if [ "${COST:-0}" -gt 0 ] && [ "${COST:-0}" -lt 100 ]; then
            echo "::error::默认成本表不完整（$COST 行）"
            exit 1
          fi
          if [ "${COST:-0}" -eq 0 ]; then
            echo "::warning::这个包没有随带成本表，首次使用需手动导入（净利会按 0 成本算，偏高）"
          fi
          echo
          echo "===== 3) 起桥 → 打接口 ====="
          "$APP" serve > /tmp/jingli-serve.log 2>&1 &
          SERVE_PID=$!
          OK=0
          for i in $(seq 1 20); do
            sleep 1
            if curl -s --max-time 3 http://127.0.0.1:8765/api/selfcheck > /tmp/selfcheck.json; then OK=1; break; fi
          done
          echo "自检接口："; head -c 500 /tmp/selfcheck.json 2>/dev/null; echo
          echo "活口（店铺/在线/端口）："; curl -s --max-time 3 http://127.0.0.1:8765/api/live | head -c 300; echo
          echo "计划接口："; curl -s --max-time 3 http://127.0.0.1:8765/api/schedules | head -c 200; echo
          kill $SERVE_PID 2>/dev/null || true
          sleep 1
          echo
          echo "===== 4) 桥日志尾部 ====="
          tail -20 /tmp/jingli-serve.log || true
          echo
          echo "===== 5) 窗口后端能否加载（不建窗口）====="
          python3 - <<'PY'
          import webview
          from webview.platforms import cocoa
          print("webview", getattr(webview, "__version__", "?"), "| cocoa 后端导入 ok")
          PY
          if [ "$OK" != "1" ]; then
            echo "::error::桥没起来，接口打不通"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JingLiHelper-mac-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 挂到 Release（打标签自动，或手动指定 tag）
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: false
