name: Build macOS (Apple Silicon)

# 为什么放在 GitHub 上编译：
#   PyInstaller 不能交叉编译，Windows 上产不出能跑的 .app。
#   这里用 GitHub 提供的 macOS 机器（macos-14 = arm64）编好，
#   再把 .app 打包成 zip 作为构建产物下载，开发者不需要有 Mac。
#
# 触发方式：
#   1. 手动：仓库 Actions → Build macOS → Run workflow
#   2. 打标签：git push origin v0.24.83 → 自动编，并挂到 Release 上

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # 打标签触发时要往 Release 里传附件

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller pillow

      - name: 打包 .app
        run: bash packaging/build_mac.sh

      - name: 产物清单
        run: ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JingLiHelper-mac-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 打标签时挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: false
