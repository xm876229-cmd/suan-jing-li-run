name: Build macOS (Apple Silicon)

# 为什么放在 GitHub 上编译：
#   PyInstaller 不能交叉编译，Windows 上产不出能跑的 .app。
#   这里用 GitHub 提供的 macOS 机器（macos-14 = arm64）编好，
#   再把 .app 打包成 zip 作为构建产物下载，开发者不需要有 Mac。
#
# 触发方式：
#   1. 手动：仓库 Actions → Build macOS → Run workflow
#   2. 打标签：git push origin v0.24.83 → 自动编，并挂到 Release 上

# 只手动触发，**不要**加 push/tags。
# 原因：do_release.py 用 API 建 Release 时，GitHub 会顺带创建同名 tag，
# 于是「打标签就构建」会在每次发布后自己多跑一遍；两次构建的产物版本号
# 还容易错位（0.24.86 的 Release 里混进了 0.24.85 的 Mac 包，就是这么来的）。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要挂到哪个 Release（如 v0.24.86；留空只出 Artifact）"
        required: false
        default: ""

permissions:
  contents: write      # 打标签触发时要往 Release 里传附件

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller pillow

      - name: 取回成本主表（Windows 免安装包里自带，本来就是公开的）
        run: |
          python3 - <<'PY'
          import io, json, pathlib, urllib.request, zipfile

          api = ("https://api.github.com/repos/" + "${{ github.repository }}" +
                 "/releases?per_page=10")
          rel = json.load(urllib.request.urlopen(api, timeout=30))
          url = next((a["browser_download_url"] for r in rel
                      for a in r.get("assets", [])
                      if a["name"].startswith("JingLiHelper-Portable")), "")
          print("来源：", url or "（没找到）")
          if not url:
              raise SystemExit(0)
          data = urllib.request.urlopen(url, timeout=180).read()
          z = zipfile.ZipFile(io.BytesIO(data))
          # 用后缀匹配而不是 shell 通配：中文路径在 unzip 里会被当成 CP437，匹配不上
          name = next((n for n in z.namelist() if n.replace("\\", "/").endswith("数据/成本/master.csv")), "")
          if not name:
              print("压缩包里没有成本表")
              raise SystemExit(0)
          dst = pathlib.Path("数据/成本/master.csv")
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_bytes(z.read(name))
          print("成本表行数：", len(dst.read_text(encoding="utf-8", errors="replace").splitlines()))
          PY

      - name: 打包 .app
        run: bash packaging/build_mac.sh

      - name: 自检产物（架构 / 结构 / 资源）
        run: |
          # 这一步以前是「假过」的：APP 变量在下一段被指到了可执行文件上，
          # 于是 test -d "$APP/Contents/Frameworks/浏览器扩展" 检查的是一个
          # 不可能存在的路径，失败被 shell 吞掉，日志里只剩半截 OK。
          # 2026-11-15 实测就漏掉了「扩展被摊平到 Frameworks 根下」这个真问题。
          # 现在：断言失败直接让流水线红，并把 Frameworks 全量打出来。
          set -uo pipefail
          APP_DIR="dist/净利助手.app"
          BIN="$APP_DIR/Contents/MacOS/JingLiHelper"
          FW="$APP_DIR/Contents/Frameworks"
          echo "== 体积 =="
          du -sh "$APP_DIR"
          echo "== Contents =="
          ls "$APP_DIR/Contents"
          echo "== Frameworks（全量，摊平了会一眼看出来）=="
          ls "$FW"
          echo "== 可执行文件架构 =="
          file "$BIN"
          ARCH="$(lipo -archs "$BIN")"
          echo "架构：$ARCH"
          echo "== 资源断言 =="
          MISS=0
          chk_dir() { if [ -d "$1" ]; then echo "  OK   $2"; else echo "  MISS $2 -> $1"; MISS=1; fi; }
          chk_file() { if [ -f "$1" ]; then echo "  OK   $2"; else echo "  MISS $2 -> $1"; MISS=1; fi; }
          chk_dir  "$FW/浏览器扩展" "浏览器扩展目录"
          chk_file "$FW/浏览器扩展/manifest.json" "扩展 manifest.json"
          chk_file "$FW/浏览器扩展/background.js" "扩展 background.js"
          chk_dir  "$FW/默认配置" "默认配置"
          chk_file "$FW/默认数据/costs/master.csv" "默认成本表"
          echo "== Info.plist =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Contents/Info.plist"
          PLIST_VER="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Contents/Info.plist")"
          SRC_VER="$(python3 -c "import json;print(json.load(open('浏览器扩展/manifest.json',encoding='utf-8'))['version'])")"
          echo "Info.plist 版本：$PLIST_VER ｜ manifest.json 版本：$SRC_VER"
          echo "== 源码模式冒烟：导入全部模块 =="
          python3 -c "import sys;sys.path.insert(0,'.');import src.paths,src.calc,src.report,src.loader,src.setup_core,src.platform_os;print('import ok')"
          if [ "$ARCH" != "arm64" ]; then echo "::error::架构不对：$ARCH"; exit 1; fi
          if [ "$MISS" != "0" ]; then echo "::error::资源不齐，Mac 版会缺文件"; exit 1; fi
          if [ "$PLIST_VER" != "$SRC_VER" ]; then echo "::error::Info.plist 版本与 manifest.json 不一致"; exit 1; fi

      - name: 真跑一遍（诊断 / 起桥 / 接口 / 配置落盘）
        run: |
          set -uo pipefail
          APP_DIR="dist/净利助手.app"
          BIN="$APP_DIR/Contents/MacOS/JingLiHelper"
          FW="$APP_DIR/Contents/Frameworks"
          echo "===== 1) 诊断（会顺带建数据目录、补默认配置）====="
          "$BIN" doctor
          echo
          echo "===== 2) 数据目录落在哪 ====="
          D="$HOME/Library/Application Support/JingLiHelper"
          ls -la "$D" || true
          CONF=$(ls "$D/配置" 2>/dev/null | wc -l | tr -d ' ')
          COST=$(wc -l < "$D/数据/成本/master.csv" 2>/dev/null || echo 0)
          echo "配置个数：$CONF"
          echo "成本表行数：$COST"
          if [ "${CONF:-0}" -lt 8 ]; then
            echo "::error::默认配置没播种（只有 $CONF 个），首次运行会没有费率"
            exit 1
          fi
          if [ "${COST:-0}" -gt 0 ] && [ "${COST:-0}" -lt 100 ]; then
            echo "::error::默认成本表不完整（$COST 行）"
            exit 1
          fi
          if [ "${COST:-0}" -eq 0 ]; then
            echo "::warning::这个包没有随带成本表，首次使用需手动导入（净利会按 0 成本算，偏高）"
          fi
          echo
          echo "===== 3) 起桥 打接口 ====="
          "$BIN" serve > /tmp/jingli-serve.log 2>&1 &
          SERVE_PID=$!
          # 三个接口都要真的回内容，不能「selfcheck 通了就默认别的也行」。
          probe() {
            name="$1"; path="$2"; out="$3"; code=""; size=0
            for i in $(seq 1 20); do
              code=$(curl -s -o "$out" -w '%{http_code}' --max-time 6 "http://127.0.0.1:8765$path" || true)
              size=$(wc -c < "$out" 2>/dev/null | tr -d ' ')
              if [ "$code" = "200" ] && [ "${size:-0}" -gt 20 ]; then
                echo "  OK   $name（HTTP $code，${size} 字节）"
                head -c 220 "$out"; echo
                return 0
              fi
              sleep 1
            done
            echo "  FATAL $name 打不通（最后 HTTP ${code:-无}，${size:-0} 字节）"
            return 1
          }
          FAIL=0
          probe "自检接口" "/api/selfcheck" /tmp/selfcheck.json || FAIL=1
          probe "活口（店铺/在线/端口）" "/api/live" /tmp/live.json || FAIL=1
          probe "计划接口" "/api/schedules" /tmp/sched.json || FAIL=1
          kill $SERVE_PID 2>/dev/null || true
          sleep 1
          echo
          echo "===== 4) 桥日志尾部 ====="
          tail -30 /tmp/jingli-serve.log || true
          echo
          echo "===== 5) 窗口后端（在打包产物里验，不是 pip 环境）====="
          "$BIN" selfcheck-ui
          echo "Frameworks 里的 pyobjc 框架："
          ls "$FW" | grep -iE '^(objc|AppKit|Foundation|WebKit)' || true
          if [ "$FAIL" != "0" ]; then
            echo "::error::桥或接口有问题，Mac 版跑不起来"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JingLiHelper-mac-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 挂到 Release（打标签自动，或手动指定 tag）
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.zip
          fail_on_unmatched_files: false
