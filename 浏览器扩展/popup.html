<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { width: 340px; margin: 0; font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1F3B4D; }
  header { padding: 12px 16px 9px; background: #1F3B4D; color: #fff; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  header p { margin: 3px 0 0; font-size: 11px; opacity: .75; }
  main { padding: 9px 16px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 0; }
  /* 行内小按钮：不要撑满整行（button 默认 width:100%） */
  button.mini { width: auto; margin: 0; padding: 2px 8px; font-size: 11px;
                background: #EDF2F7; color: #44576B; border-radius: 4px; flex: none; }
  .k { color: #6B7B8C; }
  .v { font-weight: 600; }
  .ok { color: #2E7D32; }
  .bad { color: #C0392B; }
  .banner { display: flex; gap: 8px; align-items: center; justify-content: space-between;
            background: #FDECEA; border: 1px solid #F5C6C0; color: #9C3D1E;
            border-radius: 6px; padding: 6px 8px; font-size: 11.5px; margin-bottom: 8px; }
  .banner.hidden { display: none; }
  hr { border: 0; border-top: 1px solid #EDF2F7; margin: 8px 0; }
  .dates { display: flex; gap: 8px; }
  .dates > div { flex: 1; }
  label { display: block; font-size: 11px; color: #6B7B8C; margin: 4px 0 2px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #D5DDE5;
                     border-radius: 5px; font-size: 12px; color: #1F3B4D; letter-spacing: .3px; }
  select { width: 100%; box-sizing: border-box; padding: 5px 4px; border: 1px solid #D5DDE5;
           border-radius: 5px; font-size: 12px; color: #1F3B4D; background: #fff; }
  .cal { margin-top: 6px; border: 1px solid #D5DDE5; border-radius: 8px; padding: 8px; background: #fff; }
  .cal.hidden { display: none; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cal-head span { font-weight: 600; font-size: 12px; }
  .cal-head button { width: 24px; height: 22px; margin: 0; padding: 0; background: #EDF2F7;
                     color: #1F3B4D; font-size: 13px; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd { text-align: center; font-size: 10px; color: #8A99A8; padding: 2px 0; }
  .cal-grid .day { text-align: center; font-size: 12px; padding: 4px 0; border-radius: 4px; cursor: pointer; color: #1F3B4D; }
  .cal-grid .day:hover { background: #EDF2F7; }
  .cal-grid .day.sel { background: #1F3B4D; color: #fff; }
  .cal-grid .day.today { outline: 1px solid #5B8DB8; }
  .cal-grid .day.empty { cursor: default; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  .presets button { margin-top: 0; padding: 5px 0; font-size: 11px; background: #EDF2F7; color: #44576B; }
  button { width: 100%; margin-top: 7px; padding: 8px; border: 0; border-radius: 6px;
           background: #1F3B4D; color: #fff; font-size: 13px; cursor: pointer; }
  button.ghost { background: #EDF2F7; color: #1F3B4D; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
  .grid button { margin-top: 0; font-size: 12px; padding: 7px; }
  .sched { font-size: 12px; color: #44576B; }
  .srow { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
  .srow select, .srow input.num { padding: 3px 4px; border: 1px solid #D5DDE5; border-radius: 4px;
                                 font-size: 12px; color: #1F3B4D; }
  .srow input.num { width: 42px; }
  .hint2 { color: #8A99A8; font-size: 11px; }
  .manual { margin-top: 9px; padding: 9px 10px; border: 1px solid #E4E9EF;
            border-radius: 8px; background: #FAFBFC; }
  .manual-head { display: flex; align-items: center; gap: 10px; }
  .manual-head b { font-size: 12.5px; }
  .manual .mode { display: flex; align-items: center; gap: 4px; font-size: 11px;
                  color: #6B7B8C; cursor: pointer; }
  .manual .mode input { width: 13px; height: 13px; accent-color: #2E7D6B; }
  .manual p { margin: 5px 0 0; line-height: 1.5; }
  .result { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #F1F8F3;
            border: 1px solid #CFE6D6; font-size: 12px; line-height: 1.7; }
  .result.bad { background: #FCF3F2; border-color: #F0D2CE; }
  .result.hidden { display: none; }
  .result b { font-size: 14px; }
  .result .lbl { color: #6B7B8C; }
  #log { margin-top: 8px; max-height: 120px; overflow: auto; font-size: 11px;
         background: #F7FAFC; border-radius: 6px; padding: 6px 8px; color: #44576B;
         white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>净利取数助手 <span id="ver" style="font-weight:400;opacity:.7;font-size:11px"></span></h1>
  <p>在店铺登录态里取数，回传给本地核算程序</p>
</header>
<main>
  <!-- 扩展版本对不上时才会显示：文件更新了但扩展没重新加载，
       界面上版本号是新的、跑的还是旧代码，这种情况最难查 -->
  <div id="vermiss" class="banner hidden">
    <div>扩展没重载：跑的是 <b id="vm-run">—</b>，磁盘已到 <b id="vm-disk">—</b></div>
    <button id="vm-reload" class="mini">立即重载</button>
  </div>
  <div class="row"><span class="k">记录状态</span><span class="v" id="enabled">—</span></div>
  <div class="row"><span class="k">已抓接口</span><span class="v" id="captured">0</span></div>
  <div class="row"><span class="k">本地程序</span><span class="v" id="bridge">—</span></div>
  <div class="row"><span class="k">已识别店铺</span><span class="v" id="hosts" style="font-size:11px">—</span>
    <button id="reident" class="mini" title="重新识别当前页面登录的店铺">识别</button></div>

  <hr />
  <div class="dates">
    <div><label>起始日期</label><input type="text" id="dfrom" placeholder="2026-10-01" /></div>
    <div><label>结束日期（含）</label><input type="text" id="dto" placeholder="2026-10-15" /></div>
  </div>
  <div class="dates" style="margin-top:6px">
    <div><label>店铺</label><select id="store"></select></div>
    <div><label>国家</label><select id="country"></select></div>
  </div>
  <div style="margin-top:5px">
    <button id="calcOnly" class="ghost" style="margin:0;padding:6px;font-size:12px;width:100%">只算净利（不取数）</button>
  </div>
  <div id="cal" class="cal hidden"></div>
  <div class="presets">
    <button data-preset="month">本月</button>
    <button data-preset="lastMonth">上月</button>
    <button data-preset="last7">近7天</button>
    <button data-preset="yesterday">昨天</button>
  </div>

  <button id="runAll">立即运行：取数 + 算净利</button>
  <div id="result" class="result hidden"></div>
  <div class="grid">
    <button class="ghost" data-task="orders">订单</button>
    <button class="ghost" data-task="sku">商品 SKU + 链接资料</button>
    <button class="ghost" data-task="link">链接资料（款式编码）</button>
    <button class="ghost" data-task="affiliate">联盟佣金</button>
    <button class="ghost" data-task="ads">广告</button>
    <button class="ghost" data-task="manualAds">广告（我自己点导出）</button>
  </div>

  <div class="manual">
    <div class="manual-head">
      <b>手动导数据</b>
      <label class="mode"><input type="checkbox" id="mCapture" checked />
        <span>陪同导出（自动接住下载）</span></label>
    </div>
    <p class="hint2" id="mHint"></p>
    <div class="grid">
      <button class="ghost" data-manual="orders">订单页</button>
      <button class="ghost" data-manual="sku">商品管理</button>
      <button class="ghost" data-manual="affiliate">联盟后台</button>
      <button class="ghost" data-manual="ads">广告页</button>
    </div>
  </div>
  <hr />
  <div class="sched">
    <div class="srow">
      <label><input type="checkbox" id="wOn" /> 每周</label>
      <select id="wDay">
        <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
        <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
        <option value="0">周日</option>
      </select>
      <input type="number" id="wHour" min="0" max="23" value="9" class="num" /> 点
      <span class="hint2">算上周</span>
    </div>
    <div class="srow">
      <label><input type="checkbox" id="mOn" /> 每月</label>
      <input type="number" id="mDay" min="1" max="28" value="1" class="num" /> 日
      <input type="number" id="mHour" min="0" max="23" value="9" class="num" /> 点
      <span class="hint2">算上月</span>
    </div>
    <div id="lastRun" class="hint2" style="margin-top:4px"></div>
  </div>
  <button id="deep" class="ghost" style="font-size:11px">深度抓包 5 分钟（诊断用）</button>
  <button id="toggle" class="ghost">暂停记录</button>
  <div id="log"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
